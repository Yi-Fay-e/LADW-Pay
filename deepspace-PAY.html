<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深空帳本 · Love & Deepspace</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  :root {
    --bg-deep: #060a1a;
    --bg-card: rgba(12, 20, 45, 0.85);
    --bg-card2: rgba(20, 30, 60, 0.7);
    --border-gold: rgba(196, 160, 100, 0.4);
    --border-gold-bright: rgba(220, 185, 120, 0.7);
    --gold: #c4a064;
    --gold-light: #e8c880;
    --gold-dim: rgba(196, 160, 100, 0.3);
    --purple: #8b7fd4;
    --purple-light: #b8adec;
    --blue-star: #4a8fc4;
    --text-main: #e8e0f0;
    --text-muted: rgba(200, 185, 220, 0.65);
    --text-gold: #d4b878;
    --accent-pink: rgba(200, 140, 170, 0.6);
    --accent-blue: rgba(80, 140, 200, 0.5);
    --danger: #c47070;
    --success: #70b490;
    --shadow-gold: 0 0 20px rgba(196, 160, 100, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 星空背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(80,60,140,0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(40,80,140,0.2) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 0%, rgba(100,60,120,0.15) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  #stars-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.7;
  }

  .app-wrap {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border-gold);
    margin-bottom: 28px;
  }

  .header-left { display: flex; align-items: center; gap: 16px; }

  .avatar-wrap {
    position: relative;
    cursor: pointer;
  }

  .avatar-ring {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    padding: 2px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(196,160,100,0.3);
    overflow: hidden;
    background: var(--bg-card2);
    transition: box-shadow 0.3s;
  }
  .avatar-ring:hover { box-shadow: 0 0 20px rgba(196,160,100,0.5); }

  .avatar-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar-ring .avatar-placeholder {
    font-size: 22px; color: var(--gold-light);
  }

  .avatar-edit-hint {
    position: absolute; bottom: -2px; right: -2px;
    width: 18px; height: 18px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #000;
  }

  .header-title { }
  .title-main {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px; font-weight: 500;
    color: var(--gold-light);
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .title-sub {
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.15em;
    margin-top: 4px;
  }
  .user-name {
    font-size: 13px; color: var(--purple-light);
    margin-top: 2px; cursor: pointer;
  }
  .user-name:hover { color: var(--gold-light); }

  .header-month-nav {
    display: flex; align-items: center; gap: 12px;
  }
  .month-btn {
    background: none; border: 1px solid var(--border-gold);
    color: var(--gold); width: 30px; height: 30px;
    border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .month-btn:hover { background: var(--gold-dim); border-color: var(--gold); }
  .current-month {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px; color: var(--text-main);
    min-width: 80px; text-align: center;
  }

  /* ── Nav Tabs ── */
  .nav-tabs {
    display: flex; gap: 6px;
    border-bottom: 1px solid var(--border-gold);
    margin-bottom: 24px;
  }
  .nav-tab {
    padding: 10px 18px; cursor: pointer;
    font-size: 13px; color: var(--text-muted);
    border-bottom: 2px solid transparent;
    transition: all 0.2s; white-space: nowrap;
    background: none; border-top: none; border-left: none; border-right: none;
    letter-spacing: 0.05em;
  }
  .nav-tab:hover { color: var(--text-main); }
  .nav-tab.active {
    color: var(--gold-light);
    border-bottom-color: var(--gold);
  }

  /* ── Summary Cards ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .sum-card {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .sum-card::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
  }
  .sum-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em; margin-bottom: 6px; }
  .sum-amount { font-family: 'Noto Serif TC', serif; font-size: 22px; color: var(--gold-light); font-weight: 500; }
  .sum-icon { font-size: 14px; margin-bottom: 4px; }

  /* ── Add Record Panel ── */
  .add-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .add-panel::after {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .panel-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 15px; color: var(--gold-light);
    margin-bottom: 18px; letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title-icon { font-size: 14px; }

  .form-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 14px; align-items: flex-start;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 120px; }
  .form-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em; }

  input[type="date"], input[type="text"], input[type="number"], select, textarea {
    background: rgba(10,16,35,0.8);
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    color: var(--text-main);
    padding: 8px 12px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 8px rgba(196,160,100,0.2);
  }
  select option { background: #0c1430; }
  textarea { resize: vertical; min-height: 60px; }

  /* Type Selector */
  .type-selector {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .type-btn {
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid var(--border-gold);
    background: transparent; color: var(--text-muted);
    font-size: 12px; cursor: pointer; transition: all 0.2s;
    font-family: 'Noto Sans TC', sans-serif;
    white-space: nowrap;
  }
  .type-btn:hover { border-color: var(--gold); color: var(--text-main); }
  .type-btn.selected {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: var(--gold-light);
  }

  /* Checkboxes */
  .checkbox-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .check-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check-item input[type="checkbox"] { display: none; }
  .check-box {
    width: 16px; height: 16px;
    border: 1px solid var(--border-gold);
    border-radius: 4px; background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .check-item input:checked + .check-box {
    background: var(--gold-dim);
    border-color: var(--gold);
  }
  .check-item input:checked + .check-box::after {
    content: '✓'; font-size: 10px; color: var(--gold-light);
  }
  .check-label { font-size: 12px; color: var(--text-muted); }

  /* Buttons */
  .btn-primary {
    background: linear-gradient(135deg, rgba(196,160,100,0.3), rgba(196,160,100,0.15));
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 10px 24px; border-radius: 24px;
    font-size: 13px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.25s; letter-spacing: 0.05em;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, rgba(196,160,100,0.45), rgba(196,160,100,0.25));
    box-shadow: 0 0 16px rgba(196,160,100,0.3);
  }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border-gold);
    color: var(--text-muted); padding: 7px 14px; border-radius: 20px;
    font-size: 12px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--text-main); }
  .btn-danger {
    background: transparent; border: 1px solid rgba(196,112,112,0.4);
    color: var(--danger); padding: 5px 10px; border-radius: 6px;
    font-size: 11px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif; transition: all 0.2s;
  }
  .btn-danger:hover { background: rgba(196,112,112,0.15); }
  .btn-edit {
    background: transparent; border: 1px solid var(--border-gold);
    color: var(--text-muted); padding: 5px 10px; border-radius: 6px;
    font-size: 11px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif; transition: all 0.2s;
  }
  .btn-edit:hover { border-color: var(--gold); color: var(--gold-light); }

  /* ── Records List ── */
  .records-wrap { }
  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 14px; color: var(--gold-light);
    letter-spacing: 0.08em; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border-gold), transparent);
  }

  .record-item {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
    transition: border-color 0.2s;
    position: relative;
  }
  .record-item:hover { border-color: rgba(196,160,100,0.6); }

  .record-type-icon {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    border: 1px solid var(--border-gold);
    background: var(--bg-card2);
  }
  .type-recharge { border-color: rgba(80,140,200,0.5); color: var(--blue-star); }
  .type-weekly { border-color: rgba(139,127,212,0.5); color: var(--purple-light); }
  .type-pact { border-color: rgba(200,140,170,0.5); color: #d4a0c0; }
  .type-package { border-color: rgba(196,160,100,0.5); color: var(--gold-light); }
  .type-other { border-color: rgba(200,185,220,0.3); color: var(--text-muted); }

  .record-info { flex: 1; min-width: 0; }
  .record-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .record-type-name { font-size: 13px; color: var(--text-main); font-weight: 500; }
  .record-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: rgba(196,160,100,0.15);
    color: var(--gold); border: 1px solid var(--gold-dim);
  }
  .record-note { font-size: 11px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .record-date { font-size: 11px; color: rgba(200,185,220,0.45); }

  .record-amount { font-family: 'Noto Serif TC', serif; font-size: 17px; color: var(--gold-light); margin: 0 12px; white-space: nowrap; }
  .record-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty-state {
    text-align: center; padding: 48px 20px;
    color: var(--text-muted); font-size: 13px; line-height: 2;
  }
  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }

  /* ── Analysis ── */
  .analysis-wrap { }

  .chart-container {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 20px;
    position: relative; overflow: hidden;
  }
  .chart-container::after {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .chart-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 14px; color: var(--gold-light);
    margin-bottom: 20px; letter-spacing: 0.06em;
  }

  /* Bar Chart */
  .bar-chart { }
  .bar-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .bar-label { font-size: 11px; color: var(--text-muted); width: 50px; text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 6px; background: rgba(196,160,100,0.1); border-radius: 3px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    transition: width 0.6s ease;
    position: relative;
  }
  .bar-fill-purple { background: linear-gradient(90deg, rgba(139,127,212,0.3), var(--purple)); }
  .bar-fill-blue { background: linear-gradient(90deg, rgba(74,143,196,0.3), var(--blue-star)); }
  .bar-amount { font-size: 11px; color: var(--text-muted); width: 55px; flex-shrink: 0; }

  /* Monthly Grid */
  .month-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
    margin-bottom: 16px;
  }
  @media (max-width: 500px) { .month-grid { grid-template-columns: repeat(4, 1fr); } }
  .month-cell {
    background: rgba(10,16,35,0.6);
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    padding: 10px 8px; text-align: center;
    cursor: pointer; transition: all 0.2s;
  }
  .month-cell:hover { border-color: var(--gold); }
  .month-cell.active { border-color: var(--gold); background: var(--gold-dim); }
  .month-cell.has-data { border-color: rgba(196,160,100,0.35); }
  .month-num { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
  .month-amt { font-size: 12px; color: var(--gold-light); font-weight: 500; }
  .month-amt.zero { color: rgba(200,185,220,0.3); }

  /* Category breakdown */
  .cat-list { display: flex; flex-direction: column; gap: 8px; }
  .cat-row {
    display: flex; align-items: center; gap: 10px;
  }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cat-name { font-size: 12px; color: var(--text-muted); flex: 1; }
  .cat-pct { font-size: 11px; color: var(--text-muted); width: 35px; text-align: right; }
  .cat-bar-wrap { width: 80px; height: 4px; background: rgba(196,160,100,0.1); border-radius: 2px; overflow: hidden; }
  .cat-bar { height: 100%; border-radius: 2px; }
  .cat-amount { font-size: 12px; color: var(--gold-light); width: 60px; text-align: right; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(4,8,20,0.85);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-box {
    background: #0c1430;
    border: 1px solid var(--border-gold-bright);
    border-radius: 20px;
    padding: 28px; width: 100%; max-width: 460px;
    position: relative;
    transform: translateY(10px); transition: transform 0.25s;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-overlay.open .modal-box { transform: translateY(0); }
  .modal-box::before {
    content: '';
    position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .modal-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 17px; color: var(--gold-light); margin-bottom: 20px; letter-spacing: 0.06em;
  }
  .modal-close {
    position: absolute; top: 20px; right: 20px;
    background: none; border: none; color: var(--text-muted);
    font-size: 20px; cursor: pointer; transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text-main); }

  /* User modal */
  .avatar-upload-area {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .avatar-large {
    width: 80px; height: 80px; border-radius: 50%;
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; color: var(--gold-light);
    background: var(--bg-card2); overflow: hidden;
    cursor: pointer; transition: box-shadow 0.3s;
    box-shadow: 0 0 15px rgba(196,160,100,0.2);
  }
  .avatar-large:hover { box-shadow: 0 0 25px rgba(196,160,100,0.4); }
  .avatar-large img { width: 100%; height: 100%; object-fit: cover; }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(12,20,48,0.95);
    border: 1px solid var(--border-gold-bright);
    color: var(--gold-light);
    padding: 10px 24px; border-radius: 24px;
    font-size: 13px; z-index: 200;
    opacity: 0; transition: all 0.3s; white-space: nowrap;
    box-shadow: 0 4px 20px rgba(196,160,100,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Scroll */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 3px; }

  /* Responsive */
  @media (max-width: 600px) {
    .header { flex-wrap: wrap; gap: 12px; }
    .form-row { flex-direction: column; }
    .summary-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .hidden { display: none !important; }
  .divider { border: none; border-top: 1px solid var(--border-gold); margin: 16px 0; }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<div class="app-wrap">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="avatar-wrap" onclick="openUserModal()">
        <div class="avatar-ring" id="avatarRing">
          <span class="avatar-placeholder" id="avatarEmoji">✦</span>
        </div>
        <div class="avatar-edit-hint">✎</div>
      </div>
      <div class="header-title">
        <div class="title-main">深空帳本</div>
        <div class="user-name" id="displayName" onclick="openUserModal()">點擊設定名稱</div>
        <div class="title-sub">LOVE & DEEPSPACE · TRACKER</div>
      </div>
    </div>
    <div class="header-month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <div class="current-month" id="currentMonthLabel"></div>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <!-- Nav Tabs -->
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('record', this)">✦ 記帳</button>
    <button class="nav-tab" onclick="switchTab('monthly', this)">◈ 月度分析</button>
    <button class="nav-tab" onclick="switchTab('yearly', this)">◇ 年度總覽</button>
  </div>

  <!-- ═══ TAB: RECORD ═══ -->
  <div id="tab-record">

    <!-- Summary -->
    <div class="summary-grid" id="summaryGrid"></div>

    <!-- Add Panel -->
    <div class="add-panel">
      <div class="panel-title"><span class="panel-title-icon">✦</span> 新增消費紀錄</div>

      <div class="form-row">
        <div class="form-group" style="max-width:160px">
          <div class="form-label">日期</div>
          <input type="date" id="f-date">
        </div>
        <div class="form-group">
          <div class="form-label">消費金額（NT$）</div>
          <input type="number" id="f-amount" placeholder="0" min="0">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:14px">
        <div class="form-label">消費類型</div>
        <div class="type-selector" id="typeSelector">
          <button class="type-btn" data-type="recharge" onclick="selectType('recharge')">💎 儲值</button>
          <button class="type-btn" data-type="weekly" onclick="selectType('weekly')">📅 週卡</button>
          <button class="type-btn" data-type="pact" onclick="selectType('pact')">💌 密約</button>
          <button class="type-btn" data-type="package" onclick="selectType('package')">🎁 禮包</button>
          <button class="type-btn" data-type="other" onclick="selectType('other')">✨ 其他</button>
        </div>
      </div>

      <!-- Recharge extra -->
      <div id="extra-recharge" class="hidden" style="margin-bottom:14px">
        <div class="form-group">
          <div class="form-label">購買點數 / 備註</div>
          <input type="text" id="f-recharge-note" placeholder="例如：購買 6480 皇冠幣">
        </div>
      </div>

      <!-- Pact extra -->
      <div id="extra-pact" class="hidden" style="margin-bottom:14px">
        <div class="form-row" style="margin-bottom:10px">
          <div class="form-group">
            <div class="form-label">密約類型</div>
            <div class="checkbox-row">
              <label class="check-item">
                <input type="checkbox" id="pact-normal">
                <div class="check-box"></div>
                <span class="check-label">密約</span>
              </label>
              <label class="check-item">
                <input type="checkbox" id="pact-special">
                <div class="check-box"></div>
                <span class="check-label">特別密約</span>
              </label>
            </div>
          </div>
        </div>
        <div class="form-group">
          <div class="form-label">角色</div>
          <input type="text" id="f-pact-char" placeholder="例如：黎深、沈星回、秦徹...">
        </div>
      </div>

      <!-- Other extra -->
      <div id="extra-other" class="hidden" style="margin-bottom:14px">
        <div class="form-group">
          <div class="form-label">備註說明</div>
          <input type="text" id="f-other-note" placeholder="消費內容說明">
        </div>
      </div>

      <div style="display:flex; gap:10px; justify-content:flex-end; padding-top:4px">
        <button class="btn-ghost" onclick="clearForm()">清除</button>
        <button class="btn-primary" onclick="saveRecord()">✦ 記錄消費</button>
      </div>
    </div>

    <!-- Records -->
    <div class="records-wrap">
      <div class="section-title">本月消費紀錄</div>
      <div id="recordsList"></div>
    </div>
  </div>

  <!-- ═══ TAB: MONTHLY ═══ -->
  <div id="tab-monthly" class="hidden analysis-wrap">
    <div class="chart-container">
      <div class="chart-title">各類型消費分佈</div>
      <div id="monthlyBreakdown"></div>
    </div>
    <div class="chart-container">
      <div class="chart-title">近6個月趨勢</div>
      <div id="monthlyTrend"></div>
    </div>
  </div>

  <!-- ═══ TAB: YEARLY ═══ -->
  <div id="tab-yearly" class="hidden analysis-wrap">
    <div class="chart-container">
      <div class="chart-title" id="yearlyTitle">年度各月消費總覽</div>
      <div class="month-grid" id="yearMonthGrid"></div>
    </div>
    <div class="chart-container">
      <div class="chart-title">各月消費長條圖</div>
      <div id="yearlyBar"></div>
    </div>
    <div class="chart-container">
      <div class="chart-title">年度消費彙總</div>
      <div id="yearlySummaryCards" class="summary-grid"></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- User Modal -->
<div class="modal-overlay" id="userModal">
  <div class="modal-box">
    <div class="modal-title">深空獵人設定</div>
    <button class="modal-close" onclick="closeModal('userModal')">×</button>
    <div class="avatar-upload-area">
      <div class="avatar-large" id="avatarLarge" onclick="document.getElementById('avatarFileInput').click()">
        <span id="avatarLargeEmoji">✦</span>
      </div>
      <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
      <button class="btn-ghost" onclick="document.getElementById('avatarFileInput').click()">上傳頭像</button>
    </div>
    <div class="form-group" style="margin-bottom:16px">
      <div class="form-label">獵人名稱</div>
      <input type="text" id="usernameInput" placeholder="輸入你的名稱" maxlength="20">
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end">
      <button class="btn-ghost" onclick="closeModal('userModal')">取消</button>
      <button class="btn-primary" onclick="saveUserSettings()">✦ 儲存</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-title">編輯紀錄</div>
    <button class="modal-close" onclick="closeModal('editModal')">×</button>
    <div id="editModalContent"></div>
  </div>
</div>

<script>
// ── State ──
let records = JSON.parse(localStorage.getItem('ds_records') || '[]');
let userSettings = JSON.parse(localStorage.getItem('ds_user') || '{"name":"","avatar":""}');
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let selectedType = '';
let editingId = null;

const TYPE_MAP = {
  recharge: { name: '儲值', icon: '💎', cls: 'type-recharge' },
  weekly:   { name: '週卡', icon: '📅', cls: 'type-weekly' },
  pact:     { name: '密約', icon: '💌', cls: 'type-pact' },
  package:  { name: '禮包', icon: '🎁', cls: 'type-package' },
  other:    { name: '其他', icon: '✨', cls: 'type-other' },
};

const CAT_COLORS = {
  recharge: '#4a8fc4', weekly: '#8b7fd4',
  pact: '#c48aa0', package: '#c4a064', other: '#888'
};

// ── Init ──
function init() {
  setupStars();
  loadUserSettings();
  setTodayDate();
  updateMonthLabel();
  renderAll();
}

function setTodayDate() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f-date').value = today;
}

function updateMonthLabel() {
  document.getElementById('currentMonthLabel').textContent = `${currentYear} / ${String(currentMonth).padStart(2,'0')}`;
}

function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
  updateMonthLabel();
  renderAll();
}

function getMonthRecords(y, m) {
  return records.filter(r => {
    const d = new Date(r.date);
    return d.getFullYear() === y && (d.getMonth()+1) === m;
  });
}

// ── Stars ──
function setupStars() {
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  for (let i = 0; i < 180; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const r = Math.random() * 1.2;
    const alpha = Math.random() * 0.7 + 0.1;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(220,210,255,${alpha})`;
    ctx.fill();
  }
}

// ── Tabs ──
function switchTab(tab, btn) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['record','monthly','yearly'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('hidden', t !== tab);
  });
  if (tab === 'monthly') renderMonthlyAnalysis();
  if (tab === 'yearly') renderYearlyAnalysis();
}

// ── Type Select ──
function selectType(type) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.type === type);
  });
  ['recharge','pact','other'].forEach(t => {
    document.getElementById('extra-'+t).classList.toggle('hidden', t !== type);
  });
}

// ── Save Record ──
function saveRecord() {
  const date = document.getElementById('f-date').value;
  const amount = parseFloat(document.getElementById('f-amount').value);
  if (!date) { showToast('請選擇日期'); return; }
  if (!selectedType) { showToast('請選擇消費類型'); return; }
  if (isNaN(amount) || amount <= 0) { showToast('請輸入有效金額'); return; }

  const record = {
    id: Date.now().toString(),
    date, type: selectedType, amount,
    note: '',
    pactTypes: [],
    pactChar: '',
  };

  if (selectedType === 'recharge') {
    record.note = document.getElementById('f-recharge-note').value.trim();
  } else if (selectedType === 'pact') {
    const types = [];
    if (document.getElementById('pact-normal').checked) types.push('密約');
    if (document.getElementById('pact-special').checked) types.push('特別密約');
    record.pactTypes = types;
    record.pactChar = document.getElementById('f-pact-char').value.trim();
  } else if (selectedType === 'other') {
    record.note = document.getElementById('f-other-note').value.trim();
  }

  records.push(record);
  saveData();
  clearForm();
  showToast('✦ 已記錄消費');
  renderAll();
}

function clearForm() {
  document.getElementById('f-amount').value = '';
  setTodayDate();
  selectedType = '';
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  ['recharge','pact','other'].forEach(t => document.getElementById('extra-'+t).classList.add('hidden'));
  document.getElementById('f-recharge-note').value = '';
  document.getElementById('f-pact-char').value = '';
  document.getElementById('f-other-note').value = '';
  document.getElementById('pact-normal').checked = false;
  document.getElementById('pact-special').checked = false;
}

// ── Delete / Edit ──
function deleteRecord(id) {
  if (!confirm('確定刪除這筆紀錄？')) return;
  records = records.filter(r => r.id !== id);
  saveData(); renderAll(); showToast('已刪除紀錄');
}

function openEdit(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  const typeInfo = TYPE_MAP[r.type];
  let extraHtml = '';
  if (r.type === 'recharge') {
    extraHtml = `<div class="form-group"><div class="form-label">備註</div><input type="text" id="edit-note" value="${r.note}" placeholder="點數備註"></div>`;
  } else if (r.type === 'pact') {
    extraHtml = `
      <div class="form-group" style="margin-bottom:10px"><div class="form-label">密約類型</div>
      <div class="checkbox-row">
        <label class="check-item"><input type="checkbox" id="edit-pact-n" ${r.pactTypes.includes('密約')?'checked':''}><div class="check-box"></div><span class="check-label">密約</span></label>
        <label class="check-item"><input type="checkbox" id="edit-pact-s" ${r.pactTypes.includes('特別密約')?'checked':''}><div class="check-box"></div><span class="check-label">特別密約</span></label>
      </div></div>
      <div class="form-group"><div class="form-label">角色</div><input type="text" id="edit-pact-char" value="${r.pactChar}" placeholder="角色名稱"></div>`;
  } else if (r.type === 'other') {
    extraHtml = `<div class="form-group"><div class="form-label">備註</div><input type="text" id="edit-note" value="${r.note}" placeholder="備註說明"></div>`;
  }

  document.getElementById('editModalContent').innerHTML = `
    <div class="form-row" style="margin-bottom:14px">
      <div class="form-group" style="max-width:160px">
        <div class="form-label">日期</div>
        <input type="date" id="edit-date" value="${r.date}">
      </div>
      <div class="form-group">
        <div class="form-label">金額（NT$）</div>
        <input type="number" id="edit-amount" value="${r.amount}" min="0">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <div class="form-label">類型</div>
      <div style="padding:8px 12px; background:rgba(10,16,35,0.8); border:1px solid var(--border-gold); border-radius:8px; font-size:13px; color:var(--gold-light)">
        ${typeInfo.icon} ${typeInfo.name}
      </div>
    </div>
    ${extraHtml}
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px">
      <button class="btn-ghost" onclick="closeModal('editModal')">取消</button>
      <button class="btn-primary" onclick="saveEdit()">✦ 儲存</button>
    </div>
  `;
  openModal('editModal');
}

function saveEdit() {
  const r = records.find(x => x.id === editingId);
  if (!r) return;
  r.date = document.getElementById('edit-date').value;
  r.amount = parseFloat(document.getElementById('edit-amount').value) || r.amount;
  if (r.type === 'recharge' || r.type === 'other') {
    r.note = (document.getElementById('edit-note')?.value || '').trim();
  } else if (r.type === 'pact') {
    const types = [];
    if (document.getElementById('edit-pact-n')?.checked) types.push('密約');
    if (document.getElementById('edit-pact-s')?.checked) types.push('特別密約');
    r.pactTypes = types;
    r.pactChar = (document.getElementById('edit-pact-char')?.value || '').trim();
  }
  saveData(); closeModal('editModal'); renderAll(); showToast('✦ 已更新紀錄');
}

// ── Render ──
function renderAll() {
  renderSummary();
  renderRecords();
}

function renderSummary() {
  const recs = getMonthRecords(currentYear, currentMonth);
  const total = recs.reduce((s,r) => s+r.amount, 0);
  const byType = {};
  Object.keys(TYPE_MAP).forEach(t => byType[t] = 0);
  recs.forEach(r => byType[r.type] = (byType[r.type]||0) + r.amount);

  const cards = [
    { label:'當月總計', amount: total, icon:'◈' },
    { label:'儲值', amount: byType.recharge, icon:'💎' },
    { label:'密約', amount: byType.pact, icon:'💌' },
    { label:'週卡', amount: byType.weekly, icon:'📅' },
    { label:'禮包', amount: byType.package, icon:'🎁' },
  ];

  document.getElementById('summaryGrid').innerHTML = cards.map(c => `
    <div class="sum-card">
      <div class="sum-icon">${c.icon}</div>
      <div class="sum-label">${c.label}</div>
      <div class="sum-amount">$${c.amount.toLocaleString()}</div>
    </div>
  `).join('');
}

function renderRecords() {
  const recs = getMonthRecords(currentYear, currentMonth)
    .sort((a,b) => new Date(b.date) - new Date(a.date));
  const el = document.getElementById('recordsList');
  if (recs.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">✦</div>本月尚無消費紀錄<br><span style="font-size:11px">新增第一筆紀錄吧</span></div>`;
    return;
  }
  el.innerHTML = recs.map(r => {
    const t = TYPE_MAP[r.type];
    let badge = '', note = '';
    if (r.type === 'recharge' && r.note) note = r.note;
    if (r.type === 'pact') {
      if (r.pactTypes.length) badge = r.pactTypes.join('・');
      if (r.pactChar) note = r.pactChar;
    }
    if (r.type === 'other' && r.note) note = r.note;
    const dateStr = new Date(r.date+'T00:00:00').toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'});
    return `
      <div class="record-item">
        <div class="record-type-icon ${t.cls}">${t.icon}</div>
        <div class="record-info">
          <div class="record-main">
            <span class="record-type-name">${t.name}</span>
            ${badge ? `<span class="record-badge">${badge}</span>` : ''}
            <span class="record-date">${dateStr}</span>
          </div>
          ${note ? `<div class="record-note">${note}</div>` : ''}
        </div>
        <div class="record-amount">NT$${r.amount.toLocaleString()}</div>
        <div class="record-actions">
          <button class="btn-edit" onclick="openEdit('${r.id}')">編輯</button>
          <button class="btn-danger" onclick="deleteRecord('${r.id}')">刪除</button>
        </div>
      </div>
    `;
  }).join('');
}

// ── Monthly Analysis ──
function renderMonthlyAnalysis() {
  const recs = getMonthRecords(currentYear, currentMonth);
  const total = recs.reduce((s,r) => s+r.amount, 0);
  const byType = {};
  Object.keys(TYPE_MAP).forEach(t => byType[t] = 0);
  recs.forEach(r => byType[r.type] = (byType[r.type]||0) + r.amount);

  // Breakdown
  const breakHtml = total === 0
    ? `<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px">本月尚無消費資料</div>`
    : `<div class="cat-list">${Object.entries(TYPE_MAP).map(([key,info]) => {
        const amt = byType[key];
        const pct = total > 0 ? Math.round(amt/total*100) : 0;
        return `<div class="cat-row">
          <div class="cat-dot" style="background:${CAT_COLORS[key]}"></div>
          <div class="cat-name">${info.icon} ${info.name}</div>
          <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%;background:${CAT_COLORS[key]}"></div></div>
          <div class="cat-pct">${pct}%</div>
          <div class="cat-amount">$${amt.toLocaleString()}</div>
        </div>`;
      }).join('')}</div>`;
  document.getElementById('monthlyBreakdown').innerHTML = breakHtml;

  // 6-month trend
  const months = [];
  let y = currentYear, m = currentMonth;
  for (let i = 5; i >= 0; i--) {
    let tm = m - i; let ty = y;
    while (tm < 1) { tm += 12; ty--; }
    const total_m = getMonthRecords(ty, tm).reduce((s,r)=>s+r.amount, 0);
    months.push({ label:`${tm}月`, total: total_m });
  }
  const maxVal = Math.max(...months.map(m=>m.total), 1);
  const trendHtml = `<div class="cat-list">${months.map(m => `
    <div class="bar-row">
      <div class="bar-label">${m.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(m.total/maxVal*100)}%"></div></div>
      <div class="bar-amount">$${m.total.toLocaleString()}</div>
    </div>
  `).join('')}</div>`;
  document.getElementById('monthlyTrend').innerHTML = trendHtml;
}

// ── Yearly Analysis ──
function renderYearlyAnalysis() {
  document.getElementById('yearlyTitle').textContent = `${currentYear} 年度各月消費總覽`;
  const monthTotals = Array.from({length:12}, (_,i) => ({
    m: i+1,
    total: getMonthRecords(currentYear, i+1).reduce((s,r)=>s+r.amount, 0)
  }));
  const maxVal = Math.max(...monthTotals.map(m=>m.total), 1);
  const yearTotal = monthTotals.reduce((s,m)=>s+m.total, 0);

  // Grid
  document.getElementById('yearMonthGrid').innerHTML = monthTotals.map(({m, total}) => `
    <div class="month-cell ${m === currentMonth ? 'active' : ''} ${total > 0 ? 'has-data' : ''}" onclick="goToMonth(${m})">
      <div class="month-num">${m}月</div>
      <div class="month-amt ${total===0?'zero':''}">$${total > 0 ? total.toLocaleString() : '—'}</div>
    </div>
  `).join('');

  // Bar
  document.getElementById('yearlyBar').innerHTML = `<div class="cat-list">${monthTotals.map(({m, total}) => `
    <div class="bar-row">
      <div class="bar-label">${m}月</div>
      <div class="bar-track"><div class="bar-fill bar-fill-purple" style="width:${Math.round(total/maxVal*100)}%"></div></div>
      <div class="bar-amount">$${total.toLocaleString()}</div>
    </div>
  `).join('')}</div>`;

  // Year summary
  const byType = {};
  Object.keys(TYPE_MAP).forEach(t => byType[t] = 0);
  records.filter(r => new Date(r.date).getFullYear() === currentYear)
    .forEach(r => byType[r.type] = (byType[r.type]||0) + r.amount);

  document.getElementById('yearlySummaryCards').innerHTML = `
    <div class="sum-card"><div class="sum-label">年度總計</div><div class="sum-amount">$${yearTotal.toLocaleString()}</div></div>
    ${Object.entries(TYPE_MAP).map(([k,v])=>`
    <div class="sum-card"><div class="sum-icon">${v.icon}</div><div class="sum-label">${v.name}</div><div class="sum-amount">$${byType[k].toLocaleString()}</div></div>
    `).join('')}
  `;
}

function goToMonth(m) {
  currentMonth = m;
  updateMonthLabel();
  document.querySelector('.nav-tab').click();
}

// ── User ──
function loadUserSettings() {
  if (userSettings.name) {
    document.getElementById('displayName').textContent = userSettings.name;
  }
  if (userSettings.avatar) setAvatar(userSettings.avatar);
}

function openUserModal() {
  document.getElementById('usernameInput').value = userSettings.name || '';
  if (userSettings.avatar) {
    document.getElementById('avatarLarge').innerHTML = `<img src="${userSettings.avatar}">`;
  }
  openModal('userModal');
}

function saveUserSettings() {
  userSettings.name = document.getElementById('usernameInput').value.trim() || '深空獵人';
  document.getElementById('displayName').textContent = userSettings.name;
  saveData();
  closeModal('userModal');
  showToast('✦ 設定已儲存');
}

function handleAvatarUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const src = ev.target.result;
    userSettings.avatar = src;
    setAvatar(src);
    document.getElementById('avatarLarge').innerHTML = `<img src="${src}">`;
  };
  reader.readAsDataURL(file);
}

function setAvatar(src) {
  document.getElementById('avatarRing').innerHTML = `<img src="${src}">`;
}

// ── Modal ──
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); });
});

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Storage ──
function saveData() {
  localStorage.setItem('ds_records', JSON.stringify(records));
  localStorage.setItem('ds_user', JSON.stringify(userSettings));
}

init();
</script>
</body>
</html>
