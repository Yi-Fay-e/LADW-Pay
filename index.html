<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深空帳本 · Love & Deepspace</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  #accessoryMonthList {
  display: block;
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 62px;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

#accessoryMonthList .sum-card {
  background: linear-gradient(135deg, rgba(196,160,100,0.2) 0%, rgba(139,127,212,0.08) 100%);
  border: 1px solid rgba(196,160,100,0.4);
  border-radius: 2px;
  padding: 16px;
  box-shadow: 
    0 10px 30px rgba(0,0,0,0.4),
    0 0 0 1px rgba(196,160,100,0.2),
    2px 2px 4px rgba(0,0,0,0.2);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
  position: relative;
}

#accessoryMonthList .sum-card:hover {
  transform: rotate(var(--rotation)) translateY(-4px) scale(1.02);
  box-shadow: 
    0 16px 40px rgba(0,0,0,0.5),
    0 0 0 1px rgba(196,160,100,0.3),
    4px 4px 8px rgba(0,0,0,0.3);
}

#accessoryMonthList .sum-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(196,160,100,0.2);
}

  :root {
    --bg-deep: #060a1a;
    --bg-card: rgba(12, 20, 45, 0.85);
    --bg-card2: rgba(20, 30, 60, 0.7);
    --border-gold: rgba(196, 160, 100, 0.4);
    --border-gold-bright: rgba(220, 185, 120, 0.7);
    --gold: #c4a064;
    --gold-light: #e8c880;
    --gold-dim: rgba(196, 160, 100, 0.3);
    --purple: #8b7fd4;
    --purple-light: #b8adec;
    --blue-star: #4a8fc4;
    --text-main: #e8e0f0;
    --text-muted: rgba(200, 185, 220, 0.65);
    --text-gold: #d4b878;
    --accent-pink: rgba(200, 140, 170, 0.6);
    --accent-blue: rgba(80, 140, 200, 0.5);
    --danger: #c47070;
    --success: #70b490;
    --shadow-gold: 0 0 20px rgba(196, 160, 100, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 星空背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(80,60,140,0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(40,80,140,0.2) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 0%, rgba(100,60,120,0.15) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  #stars-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.7;
  }

  .app-wrap {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border-gold);
    margin-bottom: 28px;
  }

  .header-left { display: flex; align-items: center; gap: 16px; }

  .avatar-wrap {
    position: relative;
    cursor: pointer;
  }

  .avatar-ring {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    padding: 2px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(196,160,100,0.3);
    overflow: hidden;
    background: var(--bg-card2);
    transition: box-shadow 0.3s;
  }
  .avatar-ring:hover { box-shadow: 0 0 20px rgba(196,160,100,0.5); }

  .avatar-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .avatar-ring .avatar-placeholder {
    font-size: 22px; color: var(--gold-light);
  }

  .avatar-edit-hint {
    position: absolute; bottom: -2px; right: -2px;
    width: 18px; height: 18px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #000;
  }

  .header-title { }
  .title-main {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px; font-weight: 500;
    color: var(--gold-light);
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .title-sub {
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.15em;
    margin-top: 4px;
  }
  .user-name {
    font-size: 13px; color: var(--purple-light);
    margin-top: 2px; cursor: pointer;
  }
  .user-name:hover { color: var(--gold-light); }

  .header-month-nav {
    display: flex; align-items: center; gap: 12px;
  }
  .month-btn {
    background: none; border: 1px solid var(--border-gold);
    color: var(--gold); width: 30px; height: 30px;
    border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .month-btn:hover { background: var(--gold-dim); border-color: var(--gold); }
  .current-month {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px; color: var(--text-main);
    min-width: 80px; text-align: center;
  }

  /* ── Nav Tabs ── */
  .nav-tabs {
    display: flex; gap: 6px;
    border-bottom: 1px solid var(--border-gold);
    margin-bottom: 24px;
  }
  .nav-tab {
    padding: 10px 18px; cursor: pointer;
    font-size: 13px; color: var(--text-muted);
    border-bottom: 2px solid transparent;
    transition: all 0.2s; white-space: nowrap;
    background: none; border-top: none; border-left: none; border-right: none;
    letter-spacing: 0.05em;
  }
  .nav-tab:hover { color: var(--text-main); }
  .nav-tab.active {
    color: var(--gold-light);
    border-bottom-color: transparent;
    text-shadow: 0 0 8px rgba(196,160,100,0.8), 0 0 16px rgba(196,160,100,0.4);
  }

  /* ── Summary Cards ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .sum-card {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .sum-card::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
  }
  .sum-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em; margin-bottom: 6px; }
  .sum-amount { font-family: 'Noto Serif TC', serif; font-size: 22px; color: var(--gold-light); font-weight: 500; }
  .sum-icon { font-size: 14px; margin-bottom: 4px; }

  /* ── Add Record Panel ── */
  .add-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .add-panel::after {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .panel-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 15px; color: var(--gold-light);
    margin-bottom: 18px; letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title-icon { font-size: 14px; }

  .form-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 14px; align-items: flex-start;
  }

  .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 120px; }
  .form-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em; }

  input[type="date"], input[type="text"], input[type="number"], select, textarea {
    background: rgba(10,16,35,0.8);
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    color: var(--text-main);
    padding: 8px 12px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
    color-scheme: dark;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 8px rgba(196,160,100,0.2);
  }
  select option { background: #0c1430; }
  textarea { resize: vertical; min-height: 60px; }

  /* Type Selector */
  .type-selector {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .type-btn {
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid var(--border-gold);
    background: transparent; color: var(--text-muted);
    font-size: 12px; cursor: pointer; transition: all 0.2s;
    font-family: 'Noto Sans TC', sans-serif;
    white-space: nowrap;
  }
  .type-btn:hover { border-color: var(--gold); color: var(--text-main); }
  .type-btn.selected {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: var(--gold-light);
  }

  /* Checkboxes */
  .checkbox-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .check-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check-item input[type="checkbox"] { display: none; }
  .check-box {
    width: 16px; height: 16px;
    border: 1px solid var(--border-gold);
    border-radius: 4px; background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .check-item input:checked + .check-box {
    background: var(--gold-dim);
    border-color: var(--gold);
  }
  .check-item input:checked + .check-box::after {
    content: '✓'; font-size: 10px; color: var(--gold-light);
  }
  .check-label { font-size: 12px; color: var(--text-muted); }

  /* Buttons */
  .btn-primary {
    background: linear-gradient(135deg, rgba(196,160,100,0.3), rgba(196,160,100,0.15));
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 10px 24px; border-radius: 24px;
    font-size: 13px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.25s; letter-spacing: 0.05em;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, rgba(196,160,100,0.45), rgba(196,160,100,0.25));
    box-shadow: 0 0 16px rgba(196,160,100,0.3);
  }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border-gold);
    color: var(--text-muted); padding: 7px 14px; border-radius: 20px;
    font-size: 12px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--text-main); }.btn-ghost.selected { background: var(--gold-dim); border-color: var(--gold); color: var(--gold-light); }
  .btn-danger {
    background: transparent; border: 1px solid rgba(196,112,112,0.4);
    color: var(--danger); padding: 5px 10px; border-radius: 6px;
    font-size: 11px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif; transition: all 0.2s;
  }
  .btn-danger:hover { background: rgba(196,112,112,0.15); }
  .btn-edit {
    background: transparent; border: 1px solid var(--border-gold);
    color: var(--text-muted); padding: 5px 10px; border-radius: 6px;
    font-size: 11px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif; transition: all 0.2s;
  }
  .btn-edit:hover { border-color: var(--gold); color: var(--gold-light); }

  /* ── Records List ── */
  .records-wrap { }
  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 14px; color: var(--gold-light);
    letter-spacing: 0.08em; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border-gold), transparent);
  }

  .record-item {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
    transition: border-color 0.2s;
    position: relative;
  }
  /* ── Month Total Card ── */
  .month-total-card {
    background: linear-gradient(135deg, rgba(139,127,212,0.2), rgba(74,143,196,0.15));
    border: 1.5px solid var(--border-gold-bright);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  
  .month-total-card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
  }
  
  .month-total-label {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  
  .month-total-amount {
    font-family: 'Noto Serif TC', serif;
    font-size: 28px;
    color: var(--purple-light);
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .record-item:hover { border-color: rgba(196,160,100,0.6); }

  .record-type-icon {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    border: 1px solid var(--border-gold);
    background: var(--bg-card2);
  }
  .type-recharge { border-color: rgba(80,140,200,0.5); color: var(--blue-star); }
  .type-weekly { border-color: rgba(139,127,212,0.5); color: var(--purple-light); }
  .type-pact { border-color: rgba(200,140,170,0.5); color: #d4a0c0; }
  .type-package { border-color: rgba(196,160,100,0.5); color: var(--gold-light); }
  .type-other { border-color: rgba(200,185,220,0.3); color: var(--text-muted); }

  .record-info { flex: 1; min-width: 0; }
  .record-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .record-type-name { font-size: 13px; color: var(--text-main); font-weight: 500; }
  .record-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: rgba(196,160,100,0.15);
    color: var(--gold); border: 1px solid var(--gold-dim);
  }
  .record-note { font-size: 11px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .record-date { font-size: 11px; color: rgba(200,185,220,0.45); }

  .record-amount { font-family: 'Noto Serif TC', serif; font-size: 17px; color: var(--gold-light); margin: 0 12px; white-space: nowrap; }
  .record-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty-state {
    text-align: center; padding: 48px 20px;
    color: var(--text-muted); font-size: 13px; line-height: 2;
  }
  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }

  /* ── Analysis ── */
  .analysis-wrap { }

  .chart-container {
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 20px;
    position: relative; overflow: hidden;
  }
  .chart-container::after {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .chart-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 14px; color: var(--gold-light);
    margin-bottom: 20px; letter-spacing: 0.06em;
  }

  /* Bar Chart */
  .bar-chart { }
  .bar-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .bar-label { font-size: 11px; color: var(--text-muted); width: 50px; text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 6px; background: rgba(196,160,100,0.1); border-radius: 3px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    transition: width 0.6s ease;
    position: relative;
  }
  .bar-fill-purple { background: linear-gradient(90deg, rgba(139,127,212,0.3), var(--purple)); }
  .bar-fill-blue { background: linear-gradient(90deg, rgba(74,143,196,0.3), var(--blue-star)); }
  .bar-amount { font-size: 11px; color: var(--text-muted); width: 55px; flex-shrink: 0; }

  /* Monthly Grid */
  .month-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
    margin-bottom: 16px;
  }
  @media (max-width: 500px) { .month-grid { grid-template-columns: repeat(4, 1fr); } }
  .month-cell {
    background: rgba(10,16,35,0.6);
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    padding: 10px 8px; text-align: center;
    cursor: pointer; transition: all 0.2s;
  }
  .month-cell:hover { border-color: var(--gold); }
  .month-cell.active { border-color: var(--gold); background: var(--gold-dim); }
  .month-cell.has-data { border-color: rgba(196,160,100,0.35); }
  .month-num { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
  .month-amt { font-size: 12px; color: var(--gold-light); font-weight: 500; }
  .month-amt.zero { color: rgba(200,185,220,0.3); }

  /* Category breakdown */
  .cat-list { display: flex; flex-direction: column; gap: 8px; }
  .cat-row {
    display: flex; align-items: center; gap: 10px;
  }
  .cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cat-name { font-size: 12px; color: var(--text-muted); flex: 1; }
  .cat-pct { font-size: 11px; color: var(--text-muted); width: 35px; text-align: right; }
  .cat-bar-wrap { width: 80px; height: 4px; background: rgba(196,160,100,0.1); border-radius: 2px; overflow: hidden; }
  .cat-bar { height: 100%; border-radius: 2px; }
  .cat-amount { font-size: 12px; color: var(--gold-light); width: 60px; text-align: right; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(4,8,20,0.85);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-box {
    background: #0c1430;
    border: 1px solid var(--border-gold-bright);
    border-radius: 20px;
    padding: 28px; width: 100%; max-width: 460px;
    position: relative;
    transform: translateY(10px); transition: transform 0.25s;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-overlay.open .modal-box { transform: translateY(0); }
  .modal-box::before {
    content: '';
    position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .modal-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 17px; color: var(--gold-light); margin-bottom: 20px; letter-spacing: 0.06em;
  }
  .modal-close {
    position: absolute; top: 20px; right: 20px;
    background: none; border: none; color: var(--text-muted);
    font-size: 20px; cursor: pointer; transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text-main); }

  /* User modal */
  .avatar-upload-area {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .avatar-large {
    width: 80px; height: 80px; border-radius: 50%;
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; color: var(--gold-light);
    background: var(--bg-card2); overflow: hidden;
    cursor: pointer; transition: box-shadow 0.3s;
    box-shadow: 0 0 15px rgba(196,160,100,0.2);
  }
  .avatar-large:hover { box-shadow: 0 0 25px rgba(196,160,100,0.4); }
  .avatar-large img { width: 100%; height: 100%; object-fit: cover; }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(12,20,48,0.95);
    border: 1px solid var(--border-gold-bright);
    color: var(--gold-light);
    padding: 10px 24px; border-radius: 24px;
    font-size: 13px; z-index: 200;
    opacity: 0; transition: all 0.3s; white-space: nowrap;
    box-shadow: 0 4px 20px rgba(196,160,100,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  /* Scroll */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 3px; }

  /* Responsive */
  @media (max-width: 600px) {
    .header { flex-wrap: wrap; gap: 12px; }
    .form-row { flex-direction: column; }

<script>
// ── State ──
let records = JSON.parse(localStorage.getItem('ds_records') || '[]');
let userSettings = JSON.parse(localStorage.getItem('ds_user') || '{"name":"","avatar":""}');
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let selectedType = '';
let editingId = null;

const TYPE_MAP = {
  recharge: { name: '儲值', icon: '💳', cls: 'type-recharge' },
  pact: { name: '密約', icon: '💌', cls: 'type-pact' },
  weekly: { name: '週卡', icon: '📅', cls: 'type-weekly' },
  package: { name: '禮包', icon: '🎁', cls: 'type-package' },
  accessory: { name: '周邊', icon: '🛍️', cls: 'type-accessory' },
  other: { name: '其他', icon: '✦', cls: 'type-other' }
};

const CAT_COLORS = {
  recharge: '#8b7fd4',
  pact: '#c47070',
  weekly: '#70b490',
  package: '#f0a868',
  accessory: '#d4a86e',
  other: '#999'
};

// ── Init ──
function init() {
  setupStars();
  loadUserSettings();
  setTodayDate();
  updateMonthLabel();
  renderAll();
  checkArrivalNotifications();
}

function setTodayDate() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f-date').value = today;
}

function updateMonthLabel() {
  document.getElementById('currentMonthLabel').textContent = `${currentYear} / ${String(currentMonth).padStart(2,'0')}`;
}

function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
  updateMonthLabel();
  renderAll();
}

function getMonthRecords(y, m) {
  return records.filter(r => {
    const d = new Date(r.date);
    return d.getFullYear() === y && (d.getMonth()+1) === m;
  });
}

// ── Stars ──
function setupStars() {
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  for (let i = 0; i < 180; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const r = Math.random() * 1.2;
    const alpha = Math.random() * 0.7 + 0.1;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(220,210,255,${alpha})`;
    ctx.fill();
  }
}

// ── Tabs ──
function switchTab(tab, btn) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');document.getElementById('monthNavWrap').style.visibility = tab === 'record' ? 'visible' : 'hidden';
  if (tab !== 'record') {
    const now = new Date();
    currentMonth = now.getMonth() + 1;
    currentYear = now.getFullYear();
    updateMonthLabel();
    renderAll();
  }
  ['record','monthly','yearly','accessory'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('hidden', t !== tab);
  });
  if (tab === 'monthly') renderMonthlyAnalysis();
  if (tab === 'yearly') renderYearlyAnalysis();
  if (tab === 'accessory') renderAccessoryTab();
}
// ── Type Select ──
function selectType(type) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.type === type);
  });
  ['recharge','pact','accessory','other','package'].forEach(t => {
    document.getElementById('extra-'+t).classList.toggle('hidden', t !== type);
  });
}
function selectPayMethod(type, method) {
  document.querySelectorAll(`#extra-${type} .type-btn[data-pay]`).forEach(b => {
    b.classList.toggle('selected', b.dataset.pay === method);
  });
}

function updatePriceType() {
  const priceType = document.querySelector('input[name="price-type"]:checked').value;
  const wrapper = document.getElementById('price-input-wrapper');
  const inputCny = document.getElementById('f-accessory-price-cny');
  const inputTwd = document.getElementById('f-accessory-price-twd');
  const converted = document.getElementById('f-accessory-price-converted');

  if (priceType === 'none') {
    wrapper.style.display = 'none';
  } else if (priceType === 'cny') {
    wrapper.style.display = 'block';
    inputCny.style.display = 'block';
    inputTwd.style.display = 'none';
    converted.style.display = 'block';
    inputCny.oninput = () => {
      const cny = parseFloat(inputCny.value);
      const rate = parseFloat(document.getElementById('f-exchange-rate').value) || 4.5;
      if (!isNaN(cny) && cny > 0) {
        const twd = (cny * rate).toFixed(2);
        converted.textContent = `NT$${twd}`;
      } else {
        converted.textContent = '';
      }
    };
  } else if (priceType === 'twd') {
    wrapper.style.display = 'block';
    inputCny.style.display = 'none';
    inputTwd.style.display = 'block';
    converted.style.display = 'none';
  }
}

// ── Save Record ──
function saveRecord() {
  const date = document.getElementById('f-date').value;
  const amount = parseFloat(document.getElementById('f-amount').value);
  if (!date) { showToast('請選擇日期'); return; }
  if (!selectedType) { showToast('請選擇消費類型'); return; }
  if (isNaN(amount) || amount <= 0) { showToast('請輸入有效金額'); return; }

  const record = {
    id: Date.now().toString(),
    date, type: selectedType, amount,
    note: '',
    pactTypes: [],
    pactChar: '',
  };

  // 周邊特殊邏輯（簡化版）
  if (selectedType === 'accessory') {
  const product = document.getElementById('f-accessory-product').value.trim();
  const isOfficial = document.getElementById('f-accessory-official').checked;
  if (!product) { showToast('請輸入商品名稱'); return; }
  record.accessoryData = { 
    product, 
    isOfficial,
    items: [],  // 新增：商品項目
    shop: '',
    expectedArrivalDate: '',
    quantity: 1,
    packaging: 0,
    shipping: 0,
    note: ''
  };
} else if (selectedType === 'recharge') {
    record.note = document.getElementById('f-recharge-note').value.trim();
  } else if (selectedType === 'pact') {
    const types = [];
    if (document.getElementById('pact-normal').checked) types.push('密約');
    if (document.getElementById('pact-special').checked) types.push('特別密約');
    record.pactTypes = types;
    record.pactChar = document.getElementById('f-pact-char').value.trim();
  } else if (selectedType === 'package') {
    const payBtn = document.querySelector('#extra-package .type-btn[data-pay].selected');
    record.payMethod = payBtn ? payBtn.dataset.pay : 'cash';
  } else if (selectedType === 'other') {
    record.note = document.getElementById('f-other-note').value.trim();
    const payBtn = document.querySelector('#extra-other .type-btn[data-pay].selected');
    record.payMethod = payBtn ? payBtn.dataset.pay : 'cash';
  }

  records.push(record);
  saveData();
  clearForm();
  showToast('✦ 已記錄消費');
  renderAll();
}
function clearForm() {
  document.getElementById('f-amount').value = '';
  setTodayDate();
  selectedType = '';
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  ['recharge','pact','other','package'].forEach(t => document.getElementById('extra-'+t).classList.add('hidden'));
  document.getElementById('f-recharge-note').value = '';
  document.getElementById('f-pact-char').value = '';
  document.getElementById('f-other-note').value = '';
  document.getElementById('pact-normal').checked = false;
  document.getElementById('pact-special').checked = false;
}

// ── Delete / Edit ──
function deleteRecord(id) {
  if (!confirm('確定刪除這筆紀錄？')) return;
  records = records.filter(r => r.id !== id);
  saveData(); renderAll(); renderAccessoryTab(); showToast('已刪除紀錄');
}

function openEdit(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  const typeInfo = TYPE_MAP[r.type];
  let extraHtml = '';
  
  if (r.type === 'recharge') {
    extraHtml = `<div class="form-group"><div class="form-label">備註</div><input type="text" id="edit-note" value="${r.note}" placeholder="點數備註"></div>`;
  } else if (r.type === 'pact') {
    extraHtml = `
      <div class="form-group" style="margin-bottom:10px"><div class="form-label">密約類型</div>
      <div class="checkbox-row">
        <label class="check-item"><input type="checkbox" id="edit-pact-n" ${r.pactTypes.includes('密約')?'checked':''}><div class="check-box"></div><span class="check-label">密約</span></label>
        <label class="check-item"><input type="checkbox" id="edit-pact-s" ${r.pactTypes.includes('特別密約')?'checked':''}><div class="check-box"></div><span class="check-label">特別密約</span></label>
      </div></div>

function saveEdit() {
  const r = records.find(x => x.id === editingId);
  if (!r) return;
  r.date = document.getElementById('edit-date').value;
  r.amount = parseFloat(document.getElementById('edit-amount').value) || r.amount;
  if (r.type === 'recharge' || r.type === 'other') {
    r.note = (document.getElementById('edit-note')?.value || '').trim();
  } else if (r.type === 'pact') {
    const types = [];
    if (document.getElementById('edit-pact-n')?.checked) types.push('密約');

    r.pactTypes = types;
    r.pactChar = (document.getElementById('edit-pact-char')?.value || '').trim();
  }
  saveData(); closeModal('editModal'); renderAll(); showToast('✦ 已更新紀錄');
}

function checkArrivalNotifications() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const notificationDays = 10;
  const dismissed = JSON.parse(localStorage.getItem('ds_dismissed_notifs') || '[]');

  const pending = records.filter(r => {
    if (r.type !== 'accessory') return false;
    const accData = r.accessoryData || {};
    if (!accData.expectedArrivalDate) return false;
    if (dismissed.includes(r.id)) return false;
    const arrivalDate = new Date(accData.expectedArrivalDate + 'T00:00:00');
    arrivalDate.setHours(0,0,0,0);
    const daysUntil = Math.ceil((arrivalDate - today) / (1000 * 60 * 60 * 24));
    return daysUntil >= 0 && daysUntil <= notificationDays;
  });

  if (pending.length === 0) return;

  function showNotif(idx) {
    if (idx >= pending.length) return;
    const r = pending[idx];
    const accData = r.accessoryData || {};
    const arrivalDate = new Date(accData.expectedArrivalDate + 'T00:00:00');
    arrivalDate.setHours(0,0,0,0);
    const daysUntil = Math.ceil((arrivalDate - today) / (1000 * 60 * 60 * 24));
    const product = accData.product || '周邊';

    let bodyText = '';
    if (daysUntil === 0) {
      bodyText = `今天是【${product}】的預計出貨日 ✦ 去確認一下賣家有沒有動靜吧！`;
    } else {
      bodyText = `<span style="color: var(--text-main);">獵人小姐您好：</span>\n<span style="color: var(--text-main);">您的 <span style="color: var(--gold-light); font-weight: 500;">${product}</span> 距離預定出貨日還有 <span style="color: #7ec8e3; font-weight: 500;">${daysUntil} 天</span>——記得留意出貨狀況哦 ✦</span>`;
    }

    document.getElementById('notif-body').innerHTML = bodyText.replace('\n', '<br>');
    window._currentNotifId = r.id;
    window._showNextNotif = () => showNotif(idx + 1);
    openModal('notificationModal');
  }

  showNotif(0);
}

function dismissNotificationForever() {
  const id = window._currentNotifId;
  const dismissed = JSON.parse(localStorage.getItem('ds_dismissed_notifs') || '[]');
  if (!dismissed.includes(id)) dismissed.push(id);
  localStorage.setItem('ds_dismissed_notifs', JSON.stringify(dismissed));
  closeModal('notificationModal');
  setTimeout(() => { if (window._showNextNotif) window._showNextNotif(); }, 300);
}

function dismissNotificationToday() {
  closeModal('notificationModal');
  setTimeout(() => { if (window._showNextNotif) window._showNextNotif(); }, 300);
}

function updateEditPriceType() {
  const priceType = document.querySelector('input[name="edit-price-type"]:checked').value;
  const wrapper = document.getElementById('edit-price-wrapper');
  const inputCny = document.getElementById('edit-acc-price-cny');
  const inputTwd = document.getElementById('edit-acc-price-twd');
  const converted = document.getElementById('edit-price-converted');

  if (priceType === 'none') {
    wrapper.style.display = 'none';
  } else {
    wrapper.style.display = 'block';
    if (priceType === 'cny') {
      inputCny.style.display = 'block';
      inputTwd.style.display = 'none';
      converted.style.display = 'block';
      
      inputCny.oninput = () => {
        const cny = parseFloat(inputCny.value);
        const rateInput = document.getElementById('edit-exchange-rate');
        const rate = parseFloat(rateInput.value) || 4.5;
        if (!isNaN(cny) && cny > 0) {
          const twd = (cny * rate).toFixed(2);
          converted.textContent = `¥${cny} = NT$${twd}`;
        } else {
          converted.textContent = '';
        }
      };
    } else if (priceType === 'twd') {
      inputCny.style.display = 'none';
      inputTwd.style.display = 'block';
      converted.style.display = 'none';
    }
  }
}

function deleteAccessoryItem(idx) {
  const itemsList = document.getElementById('items-list');
  const rows = itemsList.querySelectorAll('.item-row');
  if (rows[idx]) {
    rows[idx].remove();
  }
  updateItemsTotal();
}

function updateItemsTotal() {
  const itemsList = document.getElementById('items-list');
  const rows = itemsList.querySelectorAll('.item-row');
  let total = 0;
  
  rows.forEach((row, idx) => {
    const priceInput = row.querySelector(`input.item-price-${idx}`);
    const qtyInput = row.querySelector(`input.item-qty-${idx}`);
    const subtotalSpan = row.querySelector(`span.item-subtotal-${idx}`);
    
    if (priceInput && qtyInput && subtotalSpan) {
      const price = parseFloat(priceInput.value) || 0;
      const qty = parseInt(qtyInput.value) || 1;
      const subtotal = price * qty;
      
      subtotalSpan.textContent = subtotal.toLocaleString();
      total += subtotal;
    }
  });
  
  const totalDisplay = document.getElementById('items-total-display');
  if (totalDisplay) {
    totalDisplay.textContent = `NT$${total.toLocaleString()}`;
  }
}
function updateAccessoryItemsDisplay() {
  const container = document.getElementById('accessory-items-container');
  const items = container.querySelectorAll('div > div > input.item-name');
  let total = 0;
  
  items.forEach((nameInput, idx) => {
    const priceInput = nameInput.parentElement.parentElement.querySelector('input.item-price');
    const qtyInput = nameInput.parentElement.parentElement.querySelector('input.item-qty');
    const subtotalDiv = nameInput.parentElement.parentElement.querySelector('div[style*="gold-light"]');
    
    const price = parseFloat(priceInput.value) || 0;
    const qty = parseInt(qtyInput.value) || 1;
    const subtotal = price * qty;
    
    subtotalDiv.textContent = `NT$${subtotal.toLocaleString()}`;
    total += subtotal;
  });
  
  const totalDiv = document.getElementById('items-total');
  if (totalDiv) {
    totalDiv.textContent = `NT$${total.toLocaleString()}`;
  }
}
function saveAccessoryEdit() {
  const r = records.find(x => x.id === editingId);
  if (!r) return;

  r.date = document.getElementById('edit-date').value;
  // 計算商品小計
  const itemsList = document.getElementById('items-list');
  let itemsTotal = 0;
  if (itemsList) {
    itemsList.querySelectorAll('.item-row').forEach((row, idx) => {
      const price = parseFloat(row.querySelector(`input.item-price-${idx}`)?.value) || 0;
      const qty = parseInt(row.querySelector(`input.item-qty-${idx}`)?.value) || 1;
      itemsTotal += price * qty;
    });
  }
  const packaging = parseFloat(document.getElementById('edit-acc-packaging').value) || 0;
  const shipping = parseFloat(document.getElementById('edit-acc-shipping').value) || 0;
  const newTotal = itemsTotal + packaging + shipping;
  const originalAmount = r.amount;

  if (newTotal > 0 && newTotal !== originalAmount) {
    if (!confirm(`商品加總金額為 NT$${newTotal.toLocaleString()}，與原記帳金額 NT$${originalAmount.toLocaleString()} 不同，是否更新總金額？`)) {
      r.amount = originalAmount;
    } else {
      r.amount = newTotal;
    }
  } else {
    r.amount = parseFloat(document.getElementById('edit-amount').value) || r.amount;
  }

  // 收集商品內容
  const items = [];
  
  if (itemsList) {
    const rows = itemsList.querySelectorAll('.item-row');
    rows.forEach((row, idx) => {
      const nameInput = row.querySelector(`input.item-name-${idx}`);
      const priceInput = row.querySelector(`input.item-price-${idx}`);
      const qtyInput = row.querySelector(`input.item-qty-${idx}`);
      
      if (nameInput && priceInput && qtyInput) {
        const name = nameInput.value.trim();
        const price = parseFloat(priceInput.value) || 0;
        const qty = parseInt(qtyInput.value) || 1;
        
        if (name) {
          items.push({ name, price, qty });
        }
      }
    });
  }

  r.accessoryData = {
    product: document.getElementById('edit-acc-product').value.trim(),
    expectedArrivalDate: document.getElementById('edit-acc-arrival').value,
    shop: document.getElementById('edit-acc-shop').value.trim(),
    items: items,
    packaging: parseFloat(document.getElementById('edit-acc-packaging').value) || 0,
    shipping: parseFloat(document.getElementById('edit-acc-shipping').value) || 0,
    note: document.getElementById('edit-acc-note').value.trim(),
    isOfficial: document.getElementById('edit-acc-official').checked
  };

  saveData();
  closeModal('editModal');
  renderAccessoryTab();
  renderAll();
  showToast('✦ 已更新周邊紀錄');
}

function saveAccessoryAdd() {
  const itemsList = document.getElementById('items-list');
  let itemsTotal = 0;
  if (itemsList) {
    itemsList.querySelectorAll('.item-row').forEach((row, idx) => {
      const price = parseFloat(row.querySelector(`input.item-price-${idx}`)?.value) || 0;
      const qty = parseInt(row.querySelector(`input.item-qty-${idx}`)?.value) || 1;
      itemsTotal += price * qty;
    });
  }
  const packaging = parseFloat(document.getElementById('edit-acc-packaging').value) || 0;
  const shipping = parseFloat(document.getElementById('edit-acc-shipping').value) || 0;
  const manualAmount = parseFloat(document.getElementById('edit-amount').value) || 0;
  const newTotal = itemsTotal + packaging + shipping;
  const finalAmount = newTotal > 0 ? newTotal : manualAmount;

  const items = [];
  if (itemsList) {
    itemsList.querySelectorAll('.item-row').forEach((row, idx) => {
      const nameInput = row.querySelector(`input.item-name-${idx}`);
      const priceInput = row.querySelector(`input.item-price-${idx}`);
      const qtyInput = row.querySelector(`input.item-qty-${idx}`);
      if (nameInput && priceInput && qtyInput) {
        const name = nameInput.value.trim();
        const price = parseFloat(priceInput.value) || 0;
        const qty = parseInt(qtyInput.value) || 1;
        if (name) items.push({ name, price, qty });
      }
    });
  }

  const record = {
    id: Date.now().toString(),
    date: document.getElementById('edit-date').value,
    type: 'accessory',
    amount: finalAmount,
    note: '',
    accessoryData: {
      product: document.getElementById('edit-acc-product').value.trim(),
      expectedArrivalDate: document.getElementById('edit-acc-arrival').value,
      shop: document.getElementById('edit-acc-shop').value.trim(),
      items: items,
      packaging: packaging,
      shipping: shipping,
      note: document.getElementById('edit-acc-note').value.trim(),
      isOfficial: document.getElementById('edit-acc-official').checked
    }
  };

  records.push(record);
  saveData();
  closeModal('editModal');
  renderAccessoryTab();
  switchAccessoryView('month');
  renderAll();
  showToast('✦ 已新增周邊紀錄');
}

// ── User ──
function loadUserSettings() {
  if (userSettings.name) {
    document.getElementById('displayName').textContent = userSettings.name;
  }
  if (userSettings.avatar) setAvatar(userSettings.avatar);
}

function openUserModal() {
  document.getElementById('usernameInput').value = userSettings.name || '';
  if (userSettings.avatar) {
    document.getElementById('avatarLarge').innerHTML = `<img src="${userSettings.avatar}">`;
  }
  openModal('userModal');
}

function saveUserSettings() {
  userSettings.name = document.getElementById('usernameInput').value.trim() || '深空獵人';
  document.getElementById('displayName').textContent = userSettings.name;
  saveData();
  closeModal('userModal');
  showToast('✦ 設定已儲存');
}

function handleAvatarUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const src = ev.target.result;
    userSettings.avatar = src;
    setAvatar(src);
    document.getElementById('avatarLarge').innerHTML = `<img src="${src}">`;
  };
  reader.readAsDataURL(file);
}

function setAvatar(src) {
  document.getElementById('avatarRing').innerHTML = `<img src="${src}">`;
}

// ── Modal ──
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(el => {
  if (el.id === 'editModal') return;
  el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); });
});

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Storage ──
function saveData() {
  localStorage.setItem('ds_records', JSON.stringify(records));
  localStorage.setItem('ds_user', JSON.stringify(userSettings));
}
function exportData() {
  const data = {
    records: records,
    user: userSettings,
    dismissed: JSON.parse(localStorage.getItem('ds_dismissed_notifs') || '[]')
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `深空帳本備份_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'-')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✦ 資料已匯出');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.records) { showToast('檔案格式錯誤'); return; }

      const choice = confirm('請選擇匯入方式：\n\n確定 → 覆蓋（清除現有資料）\n取消 → 合併（保留現有資料）');

      if (choice) {
        // 覆蓋
        records = data.records;
        if (data.user) userSettings = data.user;
        if (data.dismissed) localStorage.setItem('ds_dismissed_notifs', JSON.stringify(data.dismissed));
      } else {
        // 合併
        const existingIds = new Set(records.map(r => r.id));
        const newRecords = data.records.filter(r => !existingIds.has(r.id));
        records = [...records, ...newRecords];
      }

      saveData();
      loadUserSettings();
      renderAll();
      showToast(`✦ 匯入成功`);
    } catch {
      showToast('匯入失敗，請確認檔案格式');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

init();
</script>
